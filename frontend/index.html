<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EloCoach - Connect with professional League of Legends coaches and climb the ladder faster." />
    <meta name="theme-color" content="#eab308" />
    <title>EloCoach — LoL Coaching Platform</title>
  </head>
  <body>
    <!--
      ROOT ELEMENT:
      React mounts the entire application here.
      In main.jsx we call ReactDOM.createRoot(document.getElementById('root')).render(...)
      This replaces the content of this div with our React component tree.
    -->
    <div id="root"></div>
    <!--
      VITE ENTRY POINT:
      Vite processes this script tag and bundles it with all imports.
      The type="module" means ES modules are used (modern browsers only).
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
